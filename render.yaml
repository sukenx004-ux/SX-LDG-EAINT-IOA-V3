# Render Blueprint for the PROOF Portal server edition.
# Uses paid persistent storage because uploaded evidence must survive deploys.
services:
  - type: web
    name: proof-portal-v3
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_BASE_URL
        fromService:
          type: web
          name: proof-portal-v3
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: proof-portal-v3-db
          property: connectionString
      - key: PROOF_DATA_DIR
        value: /var/data
      - key: PROOF_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_IDLE_MINUTES
        value: "15"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_FILES_PER_REPORT
        value: "10"
    disk:
      name: proof-portal-evidence
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: proof-portal-v3-db
    databaseName: proof
    user: proof
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
