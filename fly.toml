app = "__FLY_APP_NAME__"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "10000"
  APP_BASE_URL = "https://__FLY_APP_NAME__.fly.dev"
  PROOF_DATA_DIR = "/data"
  DATABASE_URL = "sqlite:////data/proof.db"
  SESSION_IDLE_MINUTES = "15"
  COOKIE_SECURE = "true"
  MAX_UPLOAD_MB = "20"
  MAX_FILES_PER_REPORT = "10"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[mounts]
  source = "proof_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
